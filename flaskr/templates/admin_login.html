<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ログイン</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="card">
        <h1>管理者ログイン</h1>

        {% if error_msg %}
        <div class="error-box">
            {{ error_msg }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>管理者ID</label>
                <input type="text" name="username" required>
            </div>

            <div class="form-group">
                <label>パスワード</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="btn-register">ログイン</button>
        </form>
    </div>

</body>
</html>
