<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>社員登録</title>
</head>

<body>

    <h1>社員管理</h1>
    {% if message %}
    <p>{{ message }}</p>
    {% endif %}
    <h2>新規社員登録</h2>

    <form action="{{ url_for('admin_employee_register') }}" method="POST">

        <p>
            社員ID<br>
            <input type="text" name="employee_id" required>
        </p>

        <p>
            氏名<br>
            <input type="text" name="name" required>
        </p>

        <p>
            パスワード<br>
            <input type="password" name="password" required>
        </p>

        <button type="submit">登録する</button>

    </form>

    <hr>

    <h2>登録済み社員一覧</h2>

    <table border="1">
        <tr>
            <th>社員ID</th>
            <th>氏名</th>
            <th>LINE連携</th>
        </tr>

        {% for employee in employees %}
        <tr>
            <td>{{ employee[0] }}</td>
            <td>{{ employee[1] }}</td>
            <td>
                {% if employee[2] %}
                連携済み
                {% else %}
                未連携
                {% endif %}
            </td>
        </tr>
        {% endfor %}

    </table>

    <p>
        <a href="{{ url_for('admin_dashboard') }}">管理者メニューに戻る</a>
    </p>

</body>

</html>
